# Docker Compose for YOLO11/YOLO26 × VisDrone × OpenMV
#
# Provides GPU-accelerated services for training, hyperparameter
# tuning, and TensorBoard visualisation. Built on top of the official
# Ultralytics image (see docker/Dockerfile).
#
# Prerequisites on the host:
#   - NVIDIA GPU + driver
#   - NVIDIA Container Toolkit (enables --gpus all)
#   - Docker Engine 23+ with Compose v2
#
# Quickstart:
#   docker compose build
#   docker compose run --rm train            # full training pipeline
#   docker compose run --rm tune             # Ray Tune sweep (all 4 models)
#   docker compose run --rm export           # export + NPU compile (no train)
#   docker compose up tensorboard            # TensorBoard on :6006
#   docker compose run --rm shell            # interactive dev shell
#
# Optional: enable OpenMV N6 NPU compilation by mounting a local
# STM32Cube.AI / STEdgeAI-Core install at /opt/stedgeai, e.g.
#   docker compose run --rm \
#       -v /host/path/to/stedgeai:/opt/stedgeai:ro export
#

# --- Shared service config (YAML anchor) ---------------------------------
# Every GPU service reuses this block. `ipc: host` and a generous
# `shm_size` are required for PyTorch DataLoader workers. GPU access is
# declared via the portable Compose `deploy.resources` syntax which works
# with NVIDIA Container Toolkit out of the box.
#
# NOTE: the `build:` block intentionally lives on ONE service (`train`)
# only — see the comment above it. Compose v2 builds every service with
# a `build:` block via buildx bake in parallel, and when multiple bake
# targets export to the same `image:` tag they race on the final
# "naming to …" step, failing with `image "…": already exists`. Declaring
# the build once and having the other services reference the resulting
# image tag avoids the race while keeping all five services on the same
# image.
x-gpu-service: &gpu-service
  image: yolo11-26-visdrone-openmv:gpu
  ipc: host
  shm_size: "8gb"
  ulimits:
    memlock: -1
    stack: 67108864
  environment:
    - PYTHONUNBUFFERED=1
    - YOLO_DATASETS_DIR=/datasets
    - NVIDIA_VISIBLE_DEVICES=all
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  volumes:
    # Project source (live-mounted so edits on the host are reflected
    # inside the container without rebuilding)
    - .:/workspace
    # VisDrone and any other Ultralytics-downloaded datasets — persists
    # between runs so we don't re-download the ~2GB archive each time
    - datasets:/datasets
    # Ultralytics config & cache (weights, settings)
    - ultralytics-cache:/root/.config/Ultralytics
    # pip / uv wheel cache
    - pip-cache:/root/.cache/pip
  working_dir: /workspace
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # ----------------------------------------------------------------------
  # Full training + export pipeline (all 4 YOLO models → TFLite INT8 +
  # optional NPU compilation). Override the command to customise, e.g.:
  #   docker compose run --rm train python train_and_export.py --models yolo11n
  # ----------------------------------------------------------------------
  train:
    <<: *gpu-service
    # Canonical builder for the shared `yolo11-26-visdrone-openmv:gpu`
    # image. All other services reuse this tag via `image:` only — see
    # the note on `x-gpu-service` above. `docker compose build` (no
    # args) therefore runs a single build, and `docker compose build
    # train` is the explicit form.
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: yolo-visdrone-train
    command: ["python", "train_and_export.py"]

  # ----------------------------------------------------------------------
  # Ray Tune hyperparameter sweep for all four models (default). Pass
  # extra CLI args after the service name, e.g.:
  #   docker compose run --rm tune python tune_hyperparameters.py \
  #       --models yolo11s --iterations 30 --gpu-per-trial 1
  # ----------------------------------------------------------------------
  tune:
    <<: *gpu-service
    container_name: yolo-visdrone-tune
    command: ["python", "tune_hyperparameters.py"]

  # ----------------------------------------------------------------------
  # Export-only service — skips training and runs the TFLite INT8 export
  # + NPU compilation stages of train_and_export.py for all four models
  # using whatever best.pt files already exist under runs/visdrone/.
  #
  # Requires that `train` (or an equivalent run) has produced weights
  # at runs/visdrone/<model>/weights/best.pt. The image ships:
  #   - Ultralytics' full TFLite INT8 export chain (onnx, onnx2tf,
  #     tensorflow, onnxslim, onnxruntime, ai-edge-litert, ...)
  #   - Arm Vela for OpenMV AE3 (Ethos-U55) compilation
  #
  # To additionally emit Neural-ART binaries for OpenMV N6, bind-mount
  # a host STM32Cube.AI / STEdgeAI-Core install at /opt/stedgeai:
  #   docker compose run --rm \
  #       -v /host/path/to/stedgeai:/opt/stedgeai:ro export
  #
  # Override CLI args freely, e.g. to export a single model at a
  # different input size:
  #   docker compose run --rm export python train_and_export.py \
  #       --skip-train --models yolo11n --imgsz-export 192
  # ----------------------------------------------------------------------
  export:
    <<: *gpu-service
    container_name: yolo-visdrone-export
    command: ["python", "train_and_export.py", "--skip-train"]

  # ----------------------------------------------------------------------
  # OAK / OAK4 export-only service — runs the ONNX export + Luxonis
  # ModelConverter compilation stages (skips training and the AE3/N6
  # NPU steps) for all four models.
  #
  # ModelConverter is invoked as a sibling Docker container, so this
  # service mounts /var/run/docker.sock to talk to the host's Docker
  # daemon (Docker-out-of-Docker). Build the RVC4 image first per
  # docker/oak4-modelconverter.Dockerfile, and ensure the RVC2 image
  # is pulled (`docker pull luxonis/modelconverter-rvc2:latest`).
  #
  # The default command compiles for both RVC2 and RVC4 using the
  # Ultralytics-default VisDrone val split for INT8 calibration. Override
  # to compile only one target, or to point at a custom calibration set:
  #     docker compose run --rm oak-export python train_and_export.py \
  #         --skip-train --skip-npu --oak-target rvc4 \
  #         --oak-calib-dir /datasets/VisDrone/VisDrone2019-DET-val/images
  # ----------------------------------------------------------------------
  oak-export:
    <<: *gpu-service
    container_name: yolo-visdrone-oak-export
    volumes:
      - .:/workspace
      - datasets:/datasets
      - ultralytics-cache:/root/.config/Ultralytics
      - pip-cache:/root/.cache/pip
      # Docker-out-of-Docker: required so the container can launch
      # luxonis/modelconverter-rvc2 / -rvc4 sibling containers.
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - python
      - train_and_export.py
      - --skip-train
      - --skip-npu
      - --oak-target
      - both

  # ----------------------------------------------------------------------
  # TensorBoard server — visualises every training run and Ray Tune
  # trial. Browse to http://localhost:6006 once the container is up.
  # ----------------------------------------------------------------------
  tensorboard:
    <<: *gpu-service
    container_name: yolo-visdrone-tensorboard
    command:
      - tensorboard
      - --logdir
      - runs
      - --host
      - 0.0.0.0
      - --port
      - "6006"
    ports:
      - "6006:6006"

  # ----------------------------------------------------------------------
  # Interactive development shell with GPU + all project deps available.
  # Useful for ad-hoc YOLO CLI calls, debugging, or running `uv` commands
  # against the mounted workspace.
  # ----------------------------------------------------------------------
  shell:
    <<: *gpu-service
    container_name: yolo-visdrone-shell
    command: ["/bin/bash"]
    stdin_open: true
    tty: true

volumes:
  datasets:
  ultralytics-cache:
  pip-cache:
