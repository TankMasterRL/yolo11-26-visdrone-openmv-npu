[project]
name = "yolo11-26-visdrone-openmv-npu"
version = "0.1.0"
description = "Train YOLO11/YOLO26 on VisDrone and deploy INT8 TFLite models to OpenMV AE3 and N6 NPUs"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "TankMasterRL" },
]
dependencies = [
    # 8.4.33 added ``search_alg`` forwarding to ``run_ray_tune``
    # (PR ultralytics/ultralytics#23946) which is what lets us drive
    # ``model.tune(use_ray=True, search_alg=OptunaSearch(...))`` from
    # ``tune_hyperparameters.py`` without a custom ``tune.Tuner`` wrapper.
    "ultralytics>=8.4.56",
]

[project.optional-dependencies]
# Arm Vela compiler for OpenMV AE3 (Ethos-U55 NPU)
ae3 = [
    "ethos-u-vela>=5.0.0",
]
# Hyperparameter tuning with Ray Tune + Optuna + TensorBoard visualisation
tune = [
    "ray[tune]>=2.55.1",
    "optuna>=4.8.0",
    # Floor kept at 2.19 (not 2.20): the export extra pins tensorflow<=2.19.0,
    # which requires tensorboard~=2.19.0, so a >=2.20 floor makes the combined
    # ``--extra all`` install unsatisfiable. Tune-only installs still resolve
    # to the latest 2.x.
    "tensorboard>=2.19.0",
]
# Full TFLite INT8 export dependency chain required by train_and_export.py.
# These versions MUST stay inside the ranges Ultralytics' own TFLite export
# pins via check_requirements() in
# ``ultralytics/utils/export/tensorflow.py::onnx2saved_model``. If they drift
# above those ceilings Ultralytics silently re-installs/downgrades them at
# export time, and (worse) ``uv pip install --extra all`` — host *and* the
# Docker image — becomes unsatisfiable. As of ultralytics 8.4.56 the
# export-critical caps are tensorflow<=2.19.0, tf_keras<=2.19.0,
# onnx2tf>=1.26.3,<1.29.0, onnx<2.0.0 and protobuf>=5. Do NOT bump these to
# "latest": TF>=2.20 requires protobuf>=5.28/6.31 (incompatible with the
# rest of the chain) and the onnx2tf 2.x line hard-pins a conflicting
# numpy/protobuf/ai-edge-litert set.
# See https://docs.ultralytics.com/integrations/tflite/
export = [
    # tensorflow<=2.19.0 is the newest line Ultralytics' exporter supports.
    # It pulls a compatible tensorboard~=2.19.0 (mirrored in the tune extra
    # below) and accepts protobuf 5.x (<6).
    "tensorflow>=2.0.0,<=2.19.0",
    "tf_keras<=2.19.0",
    # onnx2tf consumes this ONNX; <2.0.0 keeps the IR within its support.
    "onnx>=1.21.0,<2.0.0",
    "onnx2tf>=1.26.3,<1.29.0",
    "onnxslim>=0.1.94",
    "onnxruntime",
    "sng4onnx>=2.0.1",
    "onnx_graphsurgeon>=0.6.1",
    "ai-edge-litert>=2.1.5",
    "protobuf>=5.0.0,<6.0.0",
]
# Convenience group for everything installable via pip
all = [
    "ultralytics>=8.4.56",
    "ethos-u-vela>=5.0.0",
    "ray[tune]>=2.55.1",
    "optuna>=4.8.0",
    "tensorboard>=2.19.0",
    "tensorflow>=2.0.0,<=2.19.0",
    "tf_keras<=2.19.0",
    "onnx>=1.21.0,<2.0.0",
    "onnx2tf>=1.26.3,<1.29.0",
    "onnxslim>=0.1.94",
    "onnxruntime",
    "sng4onnx>=2.0.1",
    "onnx_graphsurgeon>=0.6.1",
    "ai-edge-litert>=2.1.5",
    "protobuf>=5.0.0,<6.0.0",
]

[tool.uv]
# This project is a script collection, not an installable package
package = false
