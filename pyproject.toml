[project]
name = "yolo11-26-visdrone-openmv-npu"
version = "0.1.0"
description = "Train YOLO11/YOLO26 on VisDrone and deploy INT8 TFLite models to OpenMV AE3 and N6 NPUs"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "TankMasterRL" },
]
dependencies = [
    # 8.4.33 added ``search_alg`` forwarding to ``run_ray_tune``
    # (PR ultralytics/ultralytics#23946) which is what lets us drive
    # ``model.tune(use_ray=True, search_alg=OptunaSearch(...))`` from
    # ``tune_hyperparameters.py`` without a custom ``tune.Tuner`` wrapper.
    "ultralytics>=8.4.41",
]

[project.optional-dependencies]
# Arm Vela compiler for OpenMV AE3 (Ethos-U55 NPU)
ae3 = [
    "ethos-u-vela>=5.0.0",
]
# Hyperparameter tuning with Ray Tune + Optuna + TensorBoard visualisation
tune = [
    "ray[tune]>=2.40.0",
    "optuna>=4.0.0",
    "tensorboard>=2.19.0",
]
# Full TFLite INT8 export dependency chain required by train_and_export.py
# (Ultralytics would lazy-install these, but pinning keeps builds
# reproducible and aligns with the Docker image).
# See https://docs.ultralytics.com/integrations/tflite/
export = [
    "tensorflow>=2.19.0",
    "tf_keras<=2.21.0",
    "onnx>=1.16.0,<2.0.0",
    "onnx2tf>=2.0.0,<3.0.0",
    "onnxslim>=0.1.91",
    "onnxruntime",
    "sng4onnx>=2.0.0",
    "onnx_graphsurgeon>=0.5.0",
    "ai-edge-litert>=2.0.0",
    "protobuf>=5",
]
# Luxonis OAK (RVC2 / Myriad-X) and OAK4 (RVC4 / Qualcomm) host-side runtime
# for the DepthAI v3 peripheral-mode scripts under oak-scripts/.
#
# Note: the offline conversion toolchain (Luxonis ModelConverter, OpenVINO,
# Qualcomm SNPE) is intentionally NOT pip-installable here — it ships as
# Docker images invoked by train_and_export.py. The RVC4 image must be
# built locally; see docker/oak4-modelconverter.Dockerfile.
oak = [
    "depthai>=3.0.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
]
# Convenience group for everything installable via pip
all = [
    "ultralytics>=8.4.41",
    "ethos-u-vela>=5.0.0",
    "ray[tune]>=2.40.0",
    "optuna>=4.0.0",
    "tensorboard>=2.19.0",
    "tensorflow>=2.19.0",
    "tf_keras<=2.21.0",
    "onnx>=1.16.0,<2.0.0",
    "onnx2tf>=2.0.0,<3.0.0",
    "onnxslim>=0.1.91",
    "onnxruntime",
    "sng4onnx>=2.0.0",
    "onnx_graphsurgeon>=0.5.0",
    "ai-edge-litert>=2.0.0",
    "protobuf>=5",
    "depthai>=3.0.0",
    "opencv-python>=4.10",
]

[tool.uv]
# This project is a script collection, not an installable package
package = false
