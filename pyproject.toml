[project]
name = "yolo11-26-visdrone-openmv-npu"
version = "0.1.0"
description = "Train YOLO11/YOLO26 on VisDrone and deploy INT8 TFLite models to OpenMV AE3 and N6 NPUs"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "TankMasterRL" },
]
dependencies = [
    # 8.4.33 added ``search_alg`` forwarding to ``run_ray_tune``
    # (PR ultralytics/ultralytics#23946) which is what lets us drive
    # ``model.tune(use_ray=True, search_alg=OptunaSearch(...))`` from
    # ``tune_hyperparameters.py`` without a custom ``tune.Tuner`` wrapper.
    "ultralytics>=8.4.50",
]

[project.optional-dependencies]
# Arm Vela compiler for OpenMV AE3 (Ethos-U55 NPU)
ae3 = [
    "ethos-u-vela>=5.0.0",
]
# Hyperparameter tuning with Ray Tune + Optuna + TensorBoard visualisation
tune = [
    "ray[tune]>=2.55.1",
    "optuna>=4.8.0",
    "tensorboard>=2.20.0",
]
# Full TFLite INT8 export dependency chain required by train_and_export.py
# (Ultralytics would lazy-install these, but pinning keeps builds
# reproducible and aligns with the Docker image).
# See https://docs.ultralytics.com/integrations/tflite/
export = [
    # TF 2.21: TensorBoard removed from TF's own deps (already pinned
    # separately in the tune extra). tf.lite.Interpreter deleted in 2.20;
    # ai-edge-litert carries the replacement.
    "tensorflow>=2.21.0",
    "tf_keras<=2.21.0",
    # onnx >=1.21.0: Python 3.14 stable-ABI wheels available since 1.20.
    "onnx>=1.21.0,<2.0.0",
    "onnx2tf>=2.4.0,<3.0.0",
    "onnxslim>=0.1.93",
    "onnxruntime",
    "sng4onnx>=2.0.1",
    "onnx_graphsurgeon>=0.6.1",
    "ai-edge-litert>=2.1.4",
    "protobuf>=7.34.1,<8.0.0",
]
# Convenience group for everything installable via pip
all = [
    "ultralytics>=8.4.50",
    "ethos-u-vela>=5.0.0",
    "ray[tune]>=2.55.1",
    "optuna>=4.8.0",
    "tensorboard>=2.20.0",
    "tensorflow>=2.21.0",
    "tf_keras<=2.21.0",
    "onnx>=1.21.0,<2.0.0",
    "onnx2tf>=2.4.0,<3.0.0",
    "onnxslim>=0.1.93",
    "onnxruntime",
    "sng4onnx>=2.0.1",
    "onnx_graphsurgeon>=0.6.1",
    "ai-edge-litert>=2.1.4",
    "protobuf>=7.34.1,<8.0.0",
]

[tool.uv]
# This project is a script collection, not an installable package
package = false
